#cloud-config
# =============================================================
# Cloud-Init Control Plane
# Prépare le fichier de config kubeadm pour l'init
# =============================================================

write_files:
  # --- Config kubeadm pré-configurée ---
  # L'IP sera injectée par le script init-control-plane.sh
  - path: /etc/kubeadm/kubeadm-config.yaml
    owner: root:root
    permissions: '0644'
    content: |
      apiVersion: kubeadm.k8s.io/v1beta4
      kind: InitConfiguration
      nodeRegistration:
        criSocket: unix:///run/containerd/containerd.sock
        name: ""
        kubeletExtraArgs:
          cgroup-driver: "systemd"
      ---
      apiVersion: kubeadm.k8s.io/v1beta4
      kind: ClusterConfiguration
      kubernetesVersion: "v1.35"
      controlPlaneEndpoint: "__CP_IP__:6443"
      networking:
        podSubnet: "10.244.0.0/16"
        serviceSubnet: "10.96.0.0/12"
      ---
      apiVersion: kubelet.config.k8s.io/v1beta1
      kind: KubeletConfiguration
      cgroupDriver: "systemd"

runcmd:
  - echo "✅ Control Plane cloud-init: DONE — prêt pour kubeadm init"